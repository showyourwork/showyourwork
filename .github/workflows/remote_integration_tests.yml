name: remote tests

on:
  push:
    branches:
      - main
      - staging*
  pull_request_target:
    types: [labeled]
  merge_group:
  # TEMPORARY: allows manually dispatching this workflow against this
  # branch's own copy of the file for diagnostic purposes. Revert before
  # merging.
  workflow_dispatch:

jobs:
  tests:
    if: ${{ (github.event_name == 'push' && github.repository == 'showyourwork/showyourwork') || (github.event_name == 'pull_request_target' && contains(github.event.pull_request.labels.*.name, 'safe to test')) || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    name: Run remote integration tests
    concurrency: showyourwork-remote
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        showyourwork-spec:
          - ${{ (github.event_name == 'pull_request_target' && format('git+{0}@{1}', github.event.pull_request.head.repo.clone_url, github.event.pull_request.head.sha)) || format('git+https://github.com/showyourwork/showyourwork.git@{0}', github.sha) }}
    steps:
      - name: Remove `safe to test` label
        if: ${{ (github.event_name == 'pull_request_target' && contains(github.event.pull_request.labels.*.name, 'safe to test')) }}
        uses: andymckay/labeler@3a4296e9dcdf9576b0456050db78cfd34853f260
        with:
          remove-labels: "safe to test"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python and mamba
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: test-env
          create-args: >-
            python=3.11
            mamba
            conda

      - name: Set channel priority
        shell: micromamba-shell {0}
        run: |
          conda config --remove channels defaults || true
          conda config --add channels conda-forge
          conda config --set channel_priority strict

      - name: Install showyourwork
        shell: micromamba-shell {0}
        run: |
          echo $CONDA_PREFIX
          python -m pip install -U pip
          python -m pip install 'showyourwork[tests] @ ${{ matrix.showyourwork-spec }}'

      - name: Run remote integration tests
        shell: micromamba-shell {0}
        # TEMPORARY: -u/-s/-vv disable output buffering and capturing so we
        # can see live progress while diagnosing the timeout issue. Revert
        # once confirmed.
        run: python -u -m pytest --remote -s -vv -m "remote" tests/integration --action-spec "${{ matrix.showyourwork-spec }}#egg=showyourwork" -k 'TestCache' --max-asyncio-tasks 1
        env:
          SANDBOX_TOKEN: ${{ secrets.SANDBOX_TOKEN }}
          OVERLEAF_TOKEN: ${{ secrets.OVERLEAF_TOKEN }}
          GH_API_KEY: ${{ secrets.GH_API_KEY }}
